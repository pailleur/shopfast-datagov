version: 2

# Exposures = the things OUTSIDE dbt that use our models (dashboards, reports, ML models).
# They appear at the end of the lineage graph: impact analysis starts here.
exposures:
  - name: sales_dashboard
    label: Sales dashboard (Metabase)
    type: dashboard
    maturity: high
    owner:
      name: Sara Martin
      email: sara.martin@shopfast.example
    depends_on:
      - ref('fct_orders')
    description: "Daily revenue, orders and conversion per channel. Opened every morning by the CEO."

  - name: finance_monthly_revenue_report
    label: Finance monthly revenue report
    type: analysis
    maturity: high
    owner:
      name: Paul Girard
      email: paul.girard@shopfast.example
    depends_on:
      - ref('fct_orders')
    description: "Monthly financial closing report reconciling gross revenue, refunds, VAT and net revenue for accounting and board reporting."

  - name: churn_prediction_model
    label: Customer churn prediction ML model
    type: ml
    maturity: medium
    owner:
      name: Karim Benali
      email: karim.benali@shopfast.example
    depends_on:
      - ref('dim_customers')
    description: "Machine learning scoring pipeline predicting customer churn probability from order frequency, recency and lifetime net revenue."