version: 2

models:
  - name: fct_orders
    description: "One row per order with gross, refunded and net revenue. Source of the Sales dashboard and the Finance report."
    meta:
      owner: "Sara Martin (Head of Sales)"
      steward: "Karim Benali (Analytics Engineer)"
      domain: sales
      tier: gold
    columns:
      - name: order_id
        description: "Unique primary key of the order."
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Foreign key referencing the ordering customer in dim_customers."
      - name: order_date
        description: "Date when the order was placed (YYYY-MM-DD)."
      - name: status
        description: "Standardized order status (pending, shipped, delivered, cancelled, returned)."
      - name: channel
        description: "Sales channel where the order was placed (web, mobile_app, marketplace)."
      - name: shipping_country
        description: "ISO-2 country code where the order is shipped (FR, DE, ES, BE)."
      - name: gross_revenue_eur
        description: "Total order amount in EUROS including VAT and shipping, before refunds."
      - name: refunded_eur
        description: "Total refunded payment amount in EUROS for this order (0 if no refund)."
      - name: net_revenue_eur
        description: "{{ doc('net_revenue') }}"

  - name: dim_customers
    description: "Customer dimension table with one row per customer account enriched with lifetime order count, last order date, and lifetime net revenue."
    meta:
      owner: "Sara Martin (Head of Sales)"
      steward: "Karim Benali (Analytics Engineer)"
      domain: customer
      tier: gold
    columns:
      - name: customer_id
        description: "Unique primary key of the customer account."
        data_tests: [unique, not_null]
      - name: first_name
        description: "Customer first name formatted in title case."
        tags: ['pii']
        meta: {classification: confidential}
      - name: last_name
        description: "Customer last name formatted in title case."
        tags: ['pii']
        meta: {classification: confidential}
      - name: email
        description: "Customer normalized login email address."
        tags: ['pii']
        meta: {classification: confidential}
      - name: country_code
        description: "Standardized ISO-2 country code of the customer (FR, DE, ES, BE)."
      - name: loyalty_tier
        description: "Customer loyalty program tier (bronze, silver, gold, platinum)."
      - name: signup_date
        description: "Date when the customer created their account (YYYY-MM-DD)."
      - name: has_marketing_consent
        description: "Boolean flag indicating whether the customer opted in to marketing communications."
      - name: lifetime_orders
        description: "Total number of orders placed by the customer across all statuses."
      - name: last_order_date
        description: "Date of the customer's most recent order (NULL if no order has been placed)."
      - name: lifetime_net_revenue_eur
        description: "Cumulative net revenue in EUROS (excluding VAT, after refunds) generated by the customer."